<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>THREADLINE — Editor</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head>
<body class="admin-body"><header><a class="brand" href="index.html">THREADLINE<span>®</span></a><a class="back" href="index.html">View storefront →</a></header>
<main class="admin-shell"><aside><p class="eyebrow">Store manager</p><h1>Edit your<br><em>storefront.</em></h1><p>Changes are saved immediately to this browser. Publish a site with a real database when you are ready for team access.</p><button class="reset" id="reset">Restore starter content</button></aside>
<section class="editor"><div class="editor-head"><div><p class="eyebrow">Homepage</p><h2>Content editor</h2></div><span id="saveState">All changes saved</span></div>
<form id="editorForm"><fieldset><legend>Hero section</legend><label>Small label<input name="eyebrow"></label><label>Headline <small>Use <code>&lt;br&gt;</code> for a new line and <code>&lt;em&gt;</code> for italic text.</small><textarea name="title" rows="3"></textarea></label><label>Description<textarea name="description" rows="3"></textarea></label><label>Button text<input name="button"></label><label>Hero image URL <small>Paste an image URL, or leave the supplied image in place.</small><input name="image"></label></fieldset>
<fieldset><div class="legend-row"><legend>Products</legend><button type="button" class="add" id="addProduct">+ Add product</button></div><div id="productFields"></div></fieldset><button class="save" type="submit">Save changes →</button></form></section></main><script src="admin.js"></script></body></html>
